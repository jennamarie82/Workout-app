<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <title>Workouts</title>
</head>
<body>
  <main id="view"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Workout</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 9h14v11H5z"/></svg>
      <span>History</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-8h3.5v8zm6.25 0V4h3.5v16zM16.5 20v-11H20v11z"/></svg>
      <span>Progress</span>
    </a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="dialog" class="dialog" hidden>
    <div class="dialog-box" role="alertdialog" aria-modal="true" aria-labelledby="dialog-msg">
      <p id="dialog-msg"></p>
      <div class="dialog-actions">
        <button class="btn" data-dialog="cancel">Cancel</button>
        <button class="btn primary" data-dialog="ok">OK</button>
      </div>
    </div>
  </div>

  <script src="data/program.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
